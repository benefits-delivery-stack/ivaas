name: Generate SBOM

on:
  push:
    branches:
      - jsc/add-sbom-generation

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: income-verification-api/uv.lock
          format: cyclonedx-json
          output-file: ivaas-sbom-uv.cdx.json
          upload-artifact: false

      - name: Build income-verification-api image
        run: docker build -f income-verificaton-api/Dockerfile -t income-verification-api:latest income-verification-api

      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: income-verification-api:latest
          format: cyclonedx-json
          output-file: ivaas-sbom-image.cdx.json
          upload-artifact: false
