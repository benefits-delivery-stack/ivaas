name: Generate SBOM

on:
  push:
    branches:
      - jsc/add-sbom-generation

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SBOM_ARTIFACTS: ${RUNNER_TEMP}/sboms

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: income-verification-api/uv.lock
          format: cyclonedx-json
          output-file: ${SBOM_ARTIFACTS}/sbom-uv.cdx.json
          upload-artifact: false

      - name: Build income-verification-api image
        run: |
          docker build -f income-verification-api/Dockerfile -t income-verification-api:latest income-verification-api

      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: income-verification-api:latest
          format: cyclonedx-json
          output-file: ${SBOM_ARTIFACTS}/sbom-image.cdx.json
          upload-artifact: false

      - name: Merge SBOMs
        run: |
          # pin sha digest of cyclonedx/cyclonedx-cli:0.33.1
          docker run --rm -v "${SBOM_ARTIFACTS}:/work" -w /work \
            cyclonedx/cyclonedx-cli@sha256:252c2e26f468c25fea1e63ecde1bc3198ad6e9dbb57f5ed3236bddcb2281b3a7 \
            merge \
              --input-files sbom-uv.cdx.json sbom-image.cdx.json \
              --input-format json \
              --output-file sbom-combined.cdx.json \
              --output-format json \
              --hierarchical \
              --name benefits-delivery-stack/ivaas \
              --version "${GITHUB_SHA}"

          docker run --rm -v "${SBOM_ARTIFACTS}:/work" -w /work \
            cyclonedx/cyclonedx-cli@sha256:252c2e26f468c25fea1e63ecde1bc3198ad6e9dbb57f5ed3236bddcb2281b3a7 \
            validate --input-file sbom-combined.cdx.json --fail-on-errors

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-combined
          path: ${SBOM_ARTIFACTS}/sbom-combined.cdx.json
